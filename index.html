<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورشة صانع الألعاب</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            height: 100dvh; margin: 0; padding: 12px 10px 0;
            background:
                linear-gradient(rgba(30, 18, 10, 0.28), rgba(30, 18, 10, 0.55)),
                url("workshop-bg.png") center center / cover no-repeat,
                radial-gradient(circle at top, #4a3222 0%, #24150d 100%);
            color: #fdf6e3; touch-action: none; overflow: hidden;
        }

        #toast {
            position: fixed; top: 14px; left: 50%; transform: translate(-50%, -80px);
            background: rgba(20, 12, 8, 0.92); color: #f9e79f;
            border: 1.5px solid #f39c12; padding: 10px 18px; border-radius: 25px;
            font-size: 14px; font-weight: bold; z-index: 60;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            opacity: 0; pointer-events: none; white-space: nowrap;
        }
        #toast.show { transform: translate(-50%, 0); opacity: 1; }

        .header {
            display: flex; justify-content: space-between; gap: 6px;
            width: 100%; max-width: 400px; margin-bottom: 8px; z-index: 5;
        }
        .btn {
            flex: 1; border: none; padding: 10px 6px; border-radius: 12px;
            font-weight: bold; font-size: 13px; color: white; cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.35); transition: transform 0.1s;
        }
        .btn:active { transform: translateY(3px); }
        .btn-icon { flex: 0 0 42px; font-size: 17px; background: linear-gradient(180deg, #7f8c8d, #5d6d7e); }
        .btn-map { flex: 0 0 42px; font-size: 17px; background: linear-gradient(180deg, #8e44ad, #6c3483); }
        .btn-red { background: linear-gradient(180deg, #e74c3c, #c0392b); }
        .btn-gold { background: linear-gradient(180deg, #f39c12, #d68910); }
        .btn-blue { background: linear-gradient(180deg, #3498db, #2980b9); }
        .btn-green { background: linear-gradient(180deg, #2ecc71, #27ae60); font-size: 16px; padding: 12px 22px; flex: none; }

        .blueprint-card {
            width: 100%; max-width: 400px; z-index: 5;
            background: rgba(20, 12, 8, 0.76);
            border: 2px solid #8d5b34; border-radius: 16px;
            padding: 8px 12px; margin-bottom: 6px;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.45), 0 5px 14px rgba(0,0,0,0.22);
            backdrop-filter: blur(3px);
        }
        .toy-stage { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        .toy-info { flex: 1; text-align: right; min-width: 0; }
        .title-row { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-bottom: 4px; }
        #level-title { font-size: 15px; font-weight: bold; color: #f9e79f; }
        #moves-badge { font-size: 12px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; color: #ddd; white-space: nowrap; }
        .progress-track { width: 100%; height: 8px; background: rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; }
        #progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #f39c12, #2ecc71);
            border-radius: 10px; transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #toy-preview {
            width: 66px; height: 58px; flex: 0 0 66px;
            border-radius: 12px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-size: 28px;
            transition: transform 0.3s, box-shadow 0.4s;
        }
        #toy-image { width: 90%; height: 90%; object-fit: contain; filter: grayscale(100%); transition: filter 0.4s; }
        #toy-preview.pulse { transform: scale(1.15); }
        #blueprint { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .bp-pill {
            background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 20px;
            font-size: 14px; font-weight: bold; border: 1px solid rgba(255,255,255,0.12);
            transition: transform 0.25s, background 0.3s;
        }
        .bp-pill.done { background: rgba(46, 204, 113, 0.25); border-color: #2ecc71; color: #2ecc71; }
        .bp-pill.pop { transform: scale(1.25); background: rgba(241, 196, 15, 0.35); }
        .flying-part {
            position: fixed; z-index: 40; pointer-events: none;
            font-size: 30px; transform: translate(-50%, -50%) scale(1);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.65));
            transition: left 0.52s cubic-bezier(0.22, 1, 0.36, 1),
                        top 0.52s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.52s ease-in, opacity 0.52s ease-in;
        }
        #game-container {
            width: 100%; max-width: 420px; flex: 1; min-height: 0;
            display: flex; justify-content: center; align-items: flex-start;
        }

        #overlay {
            position: fixed; inset: 0; background: rgba(15, 10, 6, 0.90);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            gap: 12px; z-index: 30; backdrop-filter: blur(5px);
            overflow-y: auto; padding: 18px 0;
        }
        #overlay h1 { font-size: 26px; margin: 0; text-align: center; padding: 0 20px; }
        #overlay-stars { font-size: 34px; letter-spacing: 6px; }
        #overlay-sub { font-size: 14px; color: #ccc; text-align: center; padding: 0 14px; }
        .overlay-actions { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }

        #memory-card {
            display: none; width: calc(100% - 36px); max-width: 350px;
            background: linear-gradient(145deg, #56351f, #29190f);
            border: 2px solid #bd874b; border-radius: 18px; padding: 10px;
            text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            animation: memoryAppear 0.6s ease both;
        }
        #memory-image {
            width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
            border-radius: 12px; display: block; background: rgba(255,255,255,0.06);
        }
        #memory-title { color: #f9d77e; font-size: 18px; font-weight: bold; margin-top: 10px; }
        #memory-text { color: #f5e6cc; font-size: 13px; line-height: 1.7; margin: 6px 4px 2px; }
        @keyframes memoryAppear {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        #map-modal {
            position: fixed; inset: 0; background: rgba(18, 11, 7, 0.96);
            display: none; flex-direction: column; align-items: center;
            padding: 16px 14px; z-index: 50; overflow-y: auto;
        }
        .map-header {
            width: 100%; max-width: 400px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 14px;
        }
        .map-header h2 { margin: 0; color: #f9e79f; font-size: 20px; }
        .map-grid { width: 100%; max-width: 400px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding-bottom: 24px; }
        .lvl-card {
            background: rgba(255,255,255,0.08); border: 2px solid #8d5b34;
            border-radius: 14px; padding: 10px 4px; text-align: center;
            cursor: pointer; transition: transform 0.12s;
        }
        .lvl-card:active { transform: scale(0.95); }
        .lvl-card.current { border-color: #f1c40f; background: rgba(241, 196, 15, 0.18); }
        .lvl-card.locked { opacity: 0.4; border-color: #555; cursor: not-allowed; }
        .lvl-num { font-size: 16px; font-weight: bold; }
        .lvl-icon { font-size: 20px; margin: 3px 0; }
        .lvl-stars { font-size: 12px; letter-spacing: 1px; min-height: 16px; }

        @media (max-height: 650px) {
            body { padding-top: 6px; }
            .header { margin-bottom: 4px; }
            .btn { padding-top: 7px; padding-bottom: 7px; }
            .blueprint-card { padding: 6px 9px; margin-bottom: 3px; }
            #toy-preview { width: 54px; height: 48px; flex-basis: 54px; }
            #overlay { gap: 8px; }
            #memory-card { max-width: 290px; }
        }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div class="header">
        <button class="btn btn-map" onclick="openMap()" title="خريطة المراحل">🗺️</button>
        <button class="btn btn-red" onclick="uiUndo()">↩ تراجع</button>
        <button class="btn btn-gold" onclick="uiHint()">💡 تلميح</button>
        <button class="btn btn-blue" onclick="uiRestart()">🔄 إعادة</button>
        <button id="sound-btn" class="btn btn-icon" onclick="toggleSound()">🔊</button>
    </div>

    <div class="blueprint-card">
        <div class="toy-stage">
            <div id="toy-preview">
                <img id="toy-image" src="train.png" alt="القطار الخشبي">
            </div>
            <div class="toy-info">
                <div class="title-row">
                    <div id="level-title"></div>
                    <div id="moves-badge">حركات: 0</div>
                </div>
                <div class="progress-track"><div id="progress-fill"></div></div>
            </div>
        </div>
        <div id="blueprint"></div>
    </div>

    <div id="game-container"></div>

    <div id="overlay">
        <h1 id="overlay-msg"></h1>
        <div id="overlay-stars"></div>

        <div id="memory-card">
            <img id="memory-image" src="memory-train.png" alt="عم منصور وريما مع القطار الخشبي">
            <div id="memory-title">ذكرى من الماضي</div>
            <p id="memory-text">صنع عم منصور هذا القطار لطفل صغير منذ سنوات طويلة... واليوم عادت إليه ذكرى جميلة.</p>
        </div>

        <div id="overlay-sub"></div>
        <div class="overlay-actions">
            <button id="overlay-btn" class="btn btn-green"></button>
            <button class="btn btn-blue" style="flex:none; padding: 12px 16px;" onclick="openMap()">🗺️ الخريطة</button>
        </div>
    </div>

    <div id="map-modal">
        <div class="map-header">
            <h2>🗺️ خريطة الورشة</h2>
            <button class="btn btn-red" style="flex:none; padding: 8px 14px;" onclick="closeMap()">✖ إغلاق</button>
        </div>
        <div id="map-grid" class="map-grid"></div>
    </div>

    <script src="logic.js?v=6"></script>
    <script>
        class SoundFX {
            constructor() {
                this.enabled = localStorage.getItem('toymaker_sound') !== 'off';
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            tone(freq, duration, type = 'sine', volume = 0.12, delay = 0) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration);
            }
            vibrate(p) { if (this.enabled && navigator.vibrate) navigator.vibrate(p); }
            select() { this.tone(420, 0.06, 'triangle', 0.1); this.vibrate(12); }
            move() { this.tone(300, 0.08, 'sine', 0.12); this.tone(480, 0.08, 'sine', 0.08, 0.04); this.vibrate(18); }
            merge() {
                this.tone(523, 0.12, 'triangle', 0.14, 0);
                this.tone(659, 0.12, 'triangle', 0.14, 0.07);
                this.tone(784, 0.22, 'triangle', 0.16, 0.14);
                this.vibrate([25, 35, 45]);
            }
            error() { this.tone(160, 0.14, 'sawtooth', 0.08); this.vibrate(50); }
            undo() { this.tone(360, 0.07, 'sine', 0.09); this.tone(260, 0.09, 'sine', 0.09, 0.05); this.vibrate(15); }
            win() {
                [523, 659, 784, 1046].forEach((n, i) => this.tone(n, 0.22, 'triangle', 0.15, i * 0.1));
                this.vibrate([40, 50, 40, 50, 100]);
            }
        }

        const sfx = new SoundFX();
        const gameLogic = new GameLogic();
        let activeScene = null;
        let toastTimer = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function updateSoundIcon() {
            document.getElementById('sound-btn').textContent = sfx.enabled ? '🔊' : '🔇';
        }
        function toggleSound() {
            sfx.enabled = !sfx.enabled;
            localStorage.setItem('toymaker_sound', sfx.enabled ? 'on' : 'off');
            updateSoundIcon();
            if (sfx.enabled) sfx.select();
        }

        function extractToyEmoji(name) {
            const parts = name.trim().split(' ');
            return parts[parts.length - 1] || '🧸';
        }

        function updateToyPreview(pct) {
            const preview = document.getElementById('toy-preview');
            const isTrainLevel = gameLogic.levelNum === 1;

            if (isTrainLevel) {
                let image = document.getElementById('toy-image');
                if (!image) {
                    image = document.createElement('img');
                    image.id = 'toy-image';
                    preview.replaceChildren(image);
                }
                image.src = 'train.png';
                image.alt = 'القطار الخشبي';
                image.onerror = () => { preview.textContent = '🚂'; };
                image.style.filter = `grayscale(${100 - pct}%) opacity(${0.35 + (pct / 100) * 0.65})`;
            } else {
                preview.textContent = extractToyEmoji(gameLogic.toyName);
            }

            preview.style.boxShadow = pct === 100 ? '0 0 14px #2ecc71' : 'none';
        }

        function updateHUD(highlightId = null) {
            document.getElementById('level-title').textContent = `المستوى ${gameLogic.levelNum}: ${gameLogic.toyName}`;
            document.getElementById('moves-badge').textContent = `حركات: ${gameLogic.movesCount || 0}`;

            let totalReq = 0, totalDone = 0;
            for (const [id, req] of Object.entries(gameLogic.targets)) {
                totalReq += req;
                totalDone += Math.min(req, gameLogic.built[id] || 0);
            }
            const pct = totalReq > 0 ? Math.round((totalDone / totalReq) * 100) : 0;
            document.getElementById('progress-fill').style.width = `${pct}%`;

            updateToyPreview(pct);

            const preview = document.getElementById('toy-preview');
            if (highlightId) {
                preview.classList.add('pulse');
                setTimeout(() => preview.classList.remove('pulse'), 280);
            }

            const bp = document.getElementById('blueprint');
            bp.innerHTML = Object.entries(gameLogic.targets)
                .map(([id, req]) => {
                    const done = gameLogic.built[id] || 0;
                    const icon = MATERIALS[id].part;
                    const isPop = String(id) === String(highlightId) ? 'pop' : '';
                    return `<span class="bp-pill ${done >= req ? 'done' : ''} ${isPop}" data-part-id="${id}">${icon} ${done}/${req}</span>`;
                }).join('');

            if (highlightId) {
                setTimeout(() => {
                    const el = bp.querySelector(`[data-part-id="${highlightId}"]`);
                    if (el) el.classList.remove('pop');
                }, 300);
            }
        }

        function flyPartToBlueprint(colX, colY, canvasWidth, canvasHeight, partId, partIcon) {
            const canvas = document.querySelector('#game-container canvas');
            const targetEl = document.querySelector(`.bp-pill[data-part-id="${partId}"]`);
            if (!canvas || !targetEl) { updateHUD(partId); return; }

            const cRect = canvas.getBoundingClientRect();
            const startX = cRect.left + (colX / canvasWidth) * cRect.width;
            const startY = cRect.top + (colY / canvasHeight) * cRect.height;
            const tRect = targetEl.getBoundingClientRect();
            const endX = tRect.left + tRect.width / 2;
            const endY = tRect.top + tRect.height / 2;

            const flyer = document.createElement('div');
            flyer.className = 'flying-part';
            flyer.textContent = partIcon;
            flyer.style.left = `${startX}px`;
            flyer.style.top = `${startY}px`;
            document.body.appendChild(flyer);

            requestAnimationFrame(() => {
                flyer.style.left = `${endX}px`;
                flyer.style.top = `${endY}px`;
                flyer.style.transform = 'translate(-50%, -50%) scale(0.65)';
                flyer.style.opacity = '0.9';
            });

            setTimeout(() => { flyer.remove(); updateHUD(partId); }, 520);
        }

        function openMap() {
            sfx.select();
            const grid = document.getElementById('map-grid');
            grid.innerHTML = '';
            const totalToShow = Math.max(20, gameLogic.maxUnlocked + 4);

            for (let lvl = 1; lvl <= totalToShow; lvl++) {
                const isUnlocked = lvl <= gameLogic.maxUnlocked;
                const isCurrent = lvl === gameLogic.levelNum;
                const stars = gameLogic.starsMap[lvl] || 0;
                const theme = TOY_THEMES[(lvl - 1) % TOY_THEMES.length];
                const emoji = isUnlocked ? extractToyEmoji(theme) : '🔒';

                const card = document.createElement('div');
                card.className = `lvl-card ${isUnlocked ? '' : 'locked'} ${isCurrent ? 'current' : ''}`;
                card.innerHTML = `
                    <div class="lvl-num">${lvl}</div>
                    <div class="lvl-icon">${emoji}</div>
                    <div class="lvl-stars">${stars > 0 ? '⭐'.repeat(stars) : ''}</div>
                `;

                if (isUnlocked) {
                    card.onclick = () => selectLevelFromMap(lvl);
                } else {
                    card.onclick = () => {
                        sfx.error();
                        showToast('أكمل المراحل السابقة لفتح هذا المستوى 🔒');
                    };
                }
                grid.appendChild(card);
            }
            document.getElementById('map-modal').style.display = 'flex';
        }

        function closeMap() {
            sfx.select();
            document.getElementById('map-modal').style.display = 'none';
        }

        function hideMemoryCard() {
            document.getElementById('memory-card').style.display = 'none';
        }

        function selectLevelFromMap(lvl) {
            if (lvl === gameLogic.levelNum && gameLogic.status === 'playing') {
                closeMap();
                return;
            }
            document.getElementById('map-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            hideMemoryCard();
            if (!activeScene) return;
            activeScene.hintMove = null;
            activeScene.selectedCol = null;
            activeScene.winTriggered = false;
            gameLogic.loadLevel(lvl);
            sfx.select();
            updateHUD();
            activeScene.drawBoard();
        }

        class WorkshopScene extends Phaser.Scene {
            constructor() {
                super('WorkshopScene');
                this.selectedCol = null;
                this.hintMove = null;
                this.colContainers = [];
                this.winTriggered = false;
            }

            preload() {
                this.load.image('mat_1', 'wood.png?v=1');
                this.load.image('mat_2', 'iron.png?v=1');
                this.load.image('mat_3', 'cloth.png?v=1');
                this.load.image('mat_4', 'glass.png?v=1');
            }

            create() {
                activeScene = this;
                this.cameras.main.setZoom(2);
                this.cameras.main.centerOn(200, 195);
                this.createTextures();
                this.boardGroup = this.add.group();
                this.drawBoard();
                updateHUD();
            }

            createTextures() {
                const g = this.make.graphics({ x: 0, y: 0, add: false });
                g.fillStyle(0xffffff, 1);
                g.fillCircle(6, 6, 6);
                g.generateTexture('spark', 12, 12);
                g.destroy();
            }

            drawIconTile(g, w, h, isSelected) {
                const hw = w / 2, hh = h / 2;
                g.fillStyle(0x3a2415, 0.55);
                g.fillRoundedRect(-hw, -hh, w, h, 8);
                if (isSelected) {
                    g.lineStyle(2.5, 0xffffff, 1);
                    g.strokeRoundedRect(-hw, -hh, w, h, 8);
                }
            }

            drawMaterialShape(g, id, hidden, w, h, isSelected) {
                const hw = w / 2, hh = h / 2;

                if (hidden) {
                    g.fillStyle(0x6b4f35, 1);
                    g.fillRoundedRect(-hw, -hh, w, h, 7);
                    g.lineStyle(1.5, 0x3e2a19, 0.8);
                    g.strokeRect(-hw + 3, -hh + 3, w - 6, h - 6);
                    g.beginPath();
                    g.moveTo(-hw + 4, -hh + 4); g.lineTo(hw - 4, hh - 4);
                    g.moveTo(hw - 4, -hh + 4); g.lineTo(-hw + 4, hh - 4);
                    g.strokePath();
                } else if (id === 1) {
                    g.fillStyle(0xe67e22, 1);
                    g.fillRoundedRect(-hw, -hh, w, h, 8);
                    g.lineStyle(1.5, 0xa04000, 0.45);
                    g.beginPath();
                    g.moveTo(-hw + 5, -hh + 10); g.lineTo(hw - 5, -hh + 10);
                    g.moveTo(-hw + 5, hh - 10); g.lineTo(hw - 5, hh - 10);
                    g.strokePath();
                } else if (id === 2) {
                    const c = 8;
                    g.fillStyle(0x8e9eab, 1);
                    g.beginPath();
                    g.moveTo(-hw + c, -hh); g.lineTo(hw - c, -hh);
                    g.lineTo(hw, -hh + c); g.lineTo(hw, hh - c);
                    g.lineTo(hw - c, hh); g.lineTo(-hw + c, hh);
                    g.lineTo(-hw, hh - c); g.lineTo(-hw, -hh + c);
                    g.closePath(); g.fillPath();
                    g.lineStyle(1.5, 0xd5dbdb, 0.5); g.strokePath();
                } else if (id === 3) {
                    g.fillStyle(0x9b59b6, 1);
                    g.fillRoundedRect(-hw, -hh, w, h, 16);
                    g.lineStyle(1.5, 0xf5eef8, 0.5);
                    g.strokeRoundedRect(-hw + 4, -hh + 4, w - 8, h - 8, 12);
                } else {
                    g.fillStyle(0x1abc9c, 1);
                    g.fillRoundedRect(-hw, -hh, w, h, 10);
                    g.fillStyle(0xffffff, 0.22);
                    g.beginPath();
                    g.moveTo(0, -hh + 4); g.lineTo(hw - 6, 0);
                    g.lineTo(0, hh - 4); g.lineTo(-hw + 6, 0);
                    g.closePath(); g.fillPath();
                }

                g.fillStyle(0xffffff, 0.18);
                g.fillRoundedRect(-hw + 4, -hh + 2, w - 8, 5, 3);
                if (isSelected) {
                    g.lineStyle(2.5, 0xffffff, 1);
                    g.strokeRoundedRect(-hw, -hh, w, h, 9);
                }
            }

            drawBoard(dropCol = null) {
                this.boardGroup.clear(true, true);
                this.colContainers = [];

                const numCols = gameLogic.columns.length;
                const canvasW = 400;
                const gap = 8;
                const colW = Math.min(58, Math.floor((canvasW - 20 - (numCols - 1) * gap) / numCols));
                const colH = 340;
                const totalW = numCols * colW + (numCols - 1) * gap;
                const startX = (canvasW - totalW) / 2;
                const startY = 18;
                const blockH = Math.floor((colH - 20) / gameLogic.maxHeight) - 4;

                gameLogic.columns.forEach((col, colIndex) => {
                    const cx = startX + colIndex * (colW + gap) + colW / 2;
                    const cy = startY + colH / 2;
                    const container = this.add.container(cx, cy);
                    this.boardGroup.add(container);
                    this.colContainers.push(container);

                    let borderColor = 0x8b5a2b;
                    let borderWidth = 2;
                    if (this.hintMove && this.hintMove.from === colIndex) { borderColor = 0xf1c40f; borderWidth = 3; }
                    if (this.hintMove && this.hintMove.to === colIndex) { borderColor = 0x2ecc71; borderWidth = 3; }

                    const bg = this.add.graphics();

                    bg.fillStyle(0x100904, 0.65);
                    bg.fillRoundedRect(-colW / 2 + 2, -colH / 2 + 5, colW, colH, 12);

                    bg.fillStyle(0x754522, 1);
                    bg.fillRoundedRect(-colW / 2, -colH / 2, colW, colH, 11);

                    bg.fillStyle(0x4b2b17, 1);
                    bg.fillRoundedRect(-colW / 2, -colH / 2, 7, colH, { tl: 10, bl: 10, tr: 0, br: 0 });

                    bg.fillStyle(0xb77a42, 0.9);
                    bg.fillRoundedRect(colW / 2 - 6, -colH / 2 + 3, 5, colH - 6, 3);

                    bg.fillStyle(0x24150c, 1);
                    bg.fillRoundedRect(-colW / 2 + 8, -colH / 2 + 9, colW - 16, colH - 18, 7);

                    bg.fillStyle(0xc18a50, 0.12);
                    bg.fillRoundedRect(-colW / 2 + 10, -colH / 2 + 10, 3, colH - 20, 2);

                    bg.fillStyle(0xc18a50, 1);
                    bg.fillRoundedRect(-colW / 2 - 2, -colH / 2 - 2, colW + 4, 10, 5);
                    bg.lineStyle(1.5, 0xe7bd82, 0.65);
                    bg.beginPath();
                    bg.moveTo(-colW / 2 + 5, -colH / 2 + 2);
                    bg.lineTo(colW / 2 - 5, -colH / 2 + 2);
                    bg.strokePath();

                    bg.lineStyle(borderWidth, borderColor, 1);
                    bg.strokeRoundedRect(-colW / 2 - 1, -colH / 2 - 1, colW + 2, colH + 2, 11);
                    container.add(bg);

                    const hitArea = this.add.rectangle(0, 0, colW, colH, 0x000000, 0).setInteractive({ useHandCursor: true });
                    hitArea.on('pointerdown', () => this.handleColumnClick(colIndex));
                    container.add(hitArea);

                    const stackSize = this.selectedCol === colIndex ? gameLogic.getTopStack(colIndex).length : 0;

                    col.forEach((item, itemIndex) => {
                        const isSelected = this.selectedCol === colIndex && itemIndex >= col.length - stackSize;
                        const targetY = (colH / 2) - 10 - (blockH / 2) - itemIndex * (blockH + 4);
                        const yOffset = isSelected ? -10 : 0;
                        const itemBox = this.add.container(0, targetY + yOffset);
                        const shapeG = this.add.graphics();
                        const texKey = `mat_${item.id}`;

                        if (!item.hidden && this.textures.exists(texKey)) {
                            this.drawIconTile(shapeG, colW - 10, blockH, isSelected);
                            const icon = this.add.image(0, 0, texKey);
                            const maxSize = Math.min(colW - 14, blockH - 6);
                            const scale = maxSize / Math.max(icon.width, icon.height);
                            icon.setScale(scale);
                            itemBox.add([shapeG, icon]);
                        } else {
                            this.drawMaterialShape(shapeG, item.id, item.hidden, colW - 10, blockH, isSelected);
                            const emoji = item.hidden ? '📦' : MATERIALS[item.id].raw;
                            const label = this.add.text(0, 0, emoji, {
                                fontSize: `${Math.min(25, blockH - 12)}px`, resolution: 2
                            }).setOrigin(0.5);
                            itemBox.add([shapeG, label]);
                        }

                        container.add(itemBox);

                        if (dropCol === colIndex && itemIndex === col.length - 1) {
                            itemBox.y = targetY - 35;
                            this.tweens.add({ targets: itemBox, y: targetY, duration: 220, ease: 'Back.easeOut' });
                        }
                    });
                });
                this.checkGameEnd();
            }

            playMergeEffect(colIndex, partId, partIcon) {
                const container = this.colContainers[colIndex];
                if (!container) return;
                const emitter = this.add.particles(container.x, container.y - 30, 'spark', {
                    speed: { min: 60, max: 180 }, scale: { start: 1.1, end: 0 },
                    tint: [0xf1c40f, 0x2ecc71, 0xffffff, 0xe67e22],
                    lifespan: 550, gravityY: 200, emitting: false
                });
                emitter.explode(22);
                this.time.delayedCall(700, () => emitter.destroy());
                this.cameras.main.shake(120, 0.005);
                flyPartToBlueprint(container.x, container.y - 20, 400, 390, partId, partIcon);
            }

            playWinParticles() {
                const emitter = this.add.particles(200, 10, 'spark', {
                    x: { min: 20, max: 380 }, speedY: { min: 100, max: 260 },
                    speedX: { min: -50, max: 50 }, scale: { start: 1.2, end: 0.2 },
                    tint: [0xf1c40f, 0x2ecc71, 0xe74c3c, 0x3498db, 0x9b59b6],
                    lifespan: 1800, frequency: 50
                });
                this.time.delayedCall(2000, () => {
                    emitter.stop();
                    this.time.delayedCall(1800, () => emitter.destroy());
                });
            }

            shakeColumn(colIndex) {
                const c = this.colContainers[colIndex];
                if (!c) return;
                const origX = c.x;
                this.tweens.add({
                    targets: c, x: origX + 6, duration: 45, yoyo: true, repeat: 3,
                    onComplete: () => { c.x = origX; }
                });
            }

            handleColumnClick(targetCol) {
                if (gameLogic.status !== 'playing') return;
                this.hintMove = null;

                if (this.selectedCol === null) {
                    if (gameLogic.columns[targetCol].length > 0) {
                        this.selectedCol = targetCol;
                        sfx.select();
                        this.drawBoard();
                    }
                    return;
                }

                if (this.selectedCol === targetCol) {
                    this.selectedCol = null;
                    sfx.select();
                    this.drawBoard();
                    return;
                }

                const prevBuilt = { ...gameLogic.built };
                if (gameLogic.move(this.selectedCol, targetCol)) {
                    this.selectedCol = null;
                    let mergedId = null;
                    for (const id of Object.keys(gameLogic.built)) {
                        if (gameLogic.built[id] > (prevBuilt[id] || 0)) { mergedId = id; break; }
                    }
                    this.drawBoard(mergedId ? null : targetCol);
                    if (mergedId) {
                        sfx.merge();
                        this.playMergeEffect(targetCol, mergedId, MATERIALS[mergedId].part);
                    } else {
                        sfx.move();
                        updateHUD();
                    }
                } else {
                    sfx.error();
                    this.shakeColumn(targetCol);
                    this.selectedCol = gameLogic.columns[targetCol].length > 0 ? targetCol : null;
                    this.time.delayedCall(180, () => this.drawBoard());
                }
            }

            checkGameEnd() {
                const overlay = document.getElementById('overlay');
                const msg = document.getElementById('overlay-msg');
                const starsEl = document.getElementById('overlay-stars');
                const subEl = document.getElementById('overlay-sub');
                const btn = document.getElementById('overlay-btn');
                const memoryCard = document.getElementById('memory-card');

                if (gameLogic.status === 'win') {
                    msg.textContent = `🎉 اكتمل ${gameLogic.toyName}`;
                    msg.style.color = '#f1c40f';
                    const earned = gameLogic.lastEarnedStars || 1;
                    starsEl.textContent = '⭐'.repeat(earned) + '☆'.repeat(3 - earned);

                    if (gameLogic.levelNum === 1) {
                        memoryCard.style.display = 'block';
                        subEl.textContent = 'لقد أعاد القطار ذكرى جميلة إلى قلب عم منصور ❤️';
                        btn.textContent = 'المستوى التالي ➡️';
                        btn.onclick = uiNextLevel;
                    } else {
                        memoryCard.style.display = 'none';
                        subEl.textContent = `أكملته في ${gameLogic.movesCount} حركة`;
                        btn.textContent = 'المستوى التالي ➡️';
                        btn.onclick = uiNextLevel;
                    }

                    setTimeout(() => {
                        if (gameLogic.status === 'win') {
                            gameLogic.saveWinProgress();
                            overlay.style.display = 'flex';
                        }
                    }, 550);

                    if (!this.winTriggered) {
                        this.winTriggered = true;
                        sfx.win();
                        this.playWinParticles();
                    }
                } else if (gameLogic.status === 'lose') {
                    memoryCard.style.display = 'none';
                    msg.textContent = '❌ لا توجد حركات!';
                    msg.style.color = '#e74c3c';
                    starsEl.textContent = '';
                    subEl.textContent = 'جرّب التراجع أو إعادة المستوى';
                    btn.textContent = 'إعادة المستوى 🔄';
                    btn.onclick = uiRestart;
                    overlay.style.display = 'flex';
                }
            }
        }

        function uiUndo() {
            if (!activeScene) return;
            activeScene.hintMove = null;
            if (gameLogic.undo()) {
                sfx.undo();
                activeScene.selectedCol = null;
                updateHUD();
                activeScene.drawBoard();
            }
        }

        function uiHint() {
            if (!activeScene || gameLogic.status !== 'playing') return;
            const hint = gameLogic.getHint();
            if (!hint) {
                sfx.error();
                showToast('لم أجد تلميحاً الآن، جرّب التراجع خطوة ↩');
            } else {
                sfx.select();
                activeScene.hintMove = hint;
                activeScene.drawBoard();
            }
        }

        function uiRestart() {
            document.getElementById('overlay').style.display = 'none';
            hideMemoryCard();
            if (!activeScene) return;
            activeScene.hintMove = null;
            activeScene.selectedCol = null;
            activeScene.winTriggered = false;
            gameLogic.reset();
            sfx.undo();
            updateHUD();
            activeScene.drawBoard();
        }

        function uiNextLevel() {
            document.getElementById('overlay').style.display = 'none';
            hideMemoryCard();
            if (!activeScene) return;
            activeScene.hintMove = null;
            activeScene.selectedCol = null;
            activeScene.winTriggered = false;
            gameLogic.loadLevel(gameLogic.levelNum + 1);
            sfx.select();
            updateHUD();
            activeScene.drawBoard();
        }

        updateSoundIcon();
        new Phaser.Game({
            type: Phaser.AUTO,
            parent: 'game-container',
            width: 800,
            height: 780,
            antialias: true,
            transparent: true,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_HORIZONTALLY
            },
            scene: [WorkshopScene]
        });
    </script>
    <script src="story.js?v=1"></script>
</body>
