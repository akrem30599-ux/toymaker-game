<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ورشة صانع الألعاب</title>
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            background: #2c3e50; color: white; 
            touch-action: none; margin: 0; padding: 15px; 
        }
        .header { display: flex; justify-content: space-between; gap: 8px; width: 100%; max-width: 380px; margin-bottom: 12px; }
        .btn { background: #e74c3c; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-blue { background: #3498db; }
        .btn-gold { background: #f39c12; }
        .btn-green { background: #2ecc71; font-size: 18px; padding: 12px 24px; }
        
        #level-title { font-size: 20px; font-weight: bold; margin: 5px 0; }
        #blueprint { 
            display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
            background: rgba(0,0,0,0.25); padding: 10px 16px; border-radius: 10px;
            color: #f1c40f; font-weight: bold; font-size: 16px; margin-bottom: 18px; 
        }
        #board { display: flex; gap: 8px; width: 100%; max-width: 420px; justify-content: center; }
        
        .column { 
            flex: 1; max-width: 62px; height: 320px; 
            background: #34495e; border-radius: 10px; 
            display: flex; flex-direction: column-reverse; 
            padding: 4px; gap: 4px; border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .column.hint-from { border-color: #f1c40f; box-shadow: 0 0 12px #f1c40f; }
        .column.hint-to { border-color: #2ecc71; box-shadow: 0 0 12px #2ecc71; }

        .item { 
            width: 100%; height: 48px; 
            border-radius: 8px; display: flex; 
            justify-content: center; align-items: center; 
            font-size: 24px; transition: transform 0.15s;
        }
        .item.hidden { background: #7f8c8d !important; color: transparent; }
        .item.hidden::after { content: '❓'; font-size: 16px; opacity: 0.4; }
        .selected { transform: translateY(-8px) scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 2px solid #fff; }
        
        .type-1 { background: #e67e22; }
        .type-2 { background: #95a5a6; }
        .type-3 { background: #9b59b6; }
        .type-4 { background: #1abc9c; }
        
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; 
            flex-direction: column; justify-content: center; align-items: center; gap: 15px; z-index: 10;
        }
        #overlay h1 { font-size: 32px; margin: 0; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <button class="btn" onclick="undoMove()">↩ تراجع</button>
        <button class="btn btn-gold" onclick="showHint()">💡 تلميح</button>
        <button class="btn btn-blue" onclick="restartLevel()">🔄 إعادة</button>
    </div>

    <div id="level-title"></div>
    <div id="blueprint"></div>
    <div id="board"></div>

    <div id="overlay">
        <h1 id="overlay-msg"></h1>
        <button id="overlay-btn" class="btn btn-green"></button>
    </div>

    <script src="logic.js"></script>
    <script>
        const game = new GameLogic();
        const board = document.getElementById('board');
        let selectedColIndex = null;
        let hintMove = null;

        function render() {
            board.innerHTML = '';
            document.getElementById('level-title').textContent = `المستوى ${game.levelNum}: ${game.toyName}`;

            const bp = document.getElementById('blueprint');
            bp.innerHTML = Object.entries(game.targets)
                .map(([id, req]) => {
                    const done = game.built[id] || 0;
                    const icon = MATERIALS[id].part;
                    const color = done >= req ? '#2ecc71' : '#f1c40f';
                    return `<span style="color:${color}">${icon} ${done}/${req}</span>`;
                }).join(' ');

            game.columns.forEach((col, colIndex) => {
                const colDiv = document.createElement('div');
                let hintClass = '';
                if (hintMove && hintMove.from === colIndex) hintClass = 'hint-from';
                if (hintMove && hintMove.to === colIndex) hintClass = 'hint-to';

                colDiv.className = `column ${hintClass}`;
                colDiv.addEventListener('pointerdown', () => handleColumnClick(colIndex));

                const stackSize = selectedColIndex === colIndex ? game.getTopStack(colIndex).length : 0;

                col.forEach((item, itemIndex) => {
                    const itemDiv = document.createElement('div');
                    const isSelected = selectedColIndex === colIndex && itemIndex >= col.length - stackSize;
                    
                    itemDiv.className = `item type-${item.id} ${item.hidden ? 'hidden' : ''} ${isSelected ? 'selected' : ''}`;
                    itemDiv.textContent = item.hidden ? '' : MATERIALS[item.id].raw;
                    
                    colDiv.appendChild(itemDiv);
                });
                board.appendChild(colDiv);
            });

            checkGameEnd();
        }

        function handleColumnClick(targetColIndex) {
            if (game.status !== 'playing') return;
            hintMove = null;

            if (selectedColIndex === null) {
                if (game.columns[targetColIndex].length > 0) {
                    selectedColIndex = targetColIndex;
                    render();
                }
                return;
            }

            if (selectedColIndex === targetColIndex) {
                selectedColIndex = null;
                render();
                return;
            }

            if (game.move(selectedColIndex, targetColIndex)) {
                selectedColIndex = null;
            } else {
                selectedColIndex = game.columns[targetColIndex].length > 0 ? targetColIndex : null;
            }
            render();
        }

        function undoMove() {
            hintMove = null;
            if (game.undo()) {
                selectedColIndex = null;
                render();
            }
        }

        function showHint() {
            if (game.status !== 'playing') return;
            hintMove = game.getHint();
            if (!hintMove) {
                alert('لم أجد تلميحاً الآن، جرّب التراجع خطوة ↩');
            }
            render();
        }

        function restartLevel() {
            document.getElementById('overlay').style.display = 'none';
            hintMove = null;
            selectedColIndex = null;
            game.reset();
            render();
        }

        function nextLevel() {
            document.getElementById('overlay').style.display = 'none';
            hintMove = null;
            selectedColIndex = null;
            game.loadLevel(game.levelNum + 1);
            render();
        }

        function checkGameEnd() {
            const overlay = document.getElementById('overlay');
            const msg = document.getElementById('overlay-msg');
            const btn = document.getElementById('overlay-btn');

            if (game.status === 'win') {
                msg.textContent = `🎉 اكتمل ${game.toyName}`;
                msg.style.color = '#f1c40f';
                btn.textContent = 'المستوى التالي ➡️';
                btn.onclick = nextLevel;
                overlay.style.display = 'flex';
            } else if (game.status === 'lose') {
                msg.textContent = '❌ لا توجد حركات!';
                msg.style.color = '#e74c3c';
                btn.textContent = 'إعادة المستوى 🔄';
                btn.onclick = restartLevel;
                overlay.style.display = 'flex';
            }
        }

        render();
    </script>
</body>
</html>
